services:
  dbckmail:
    image: dbck/dbckmail:latest
    environment:
      - TZ=Europe/Berlin
      - DBCKMAIL_USER=username
      - DBCKMAIL_PASSWORD=password
    volumes:
      - maildata:/var/mail
    ports:
      - "127.0.0.1:9025:25"
      - "127.0.0.1:9465:465"
      - "127.0.0.1:9587:587"
      - "127.0.0.1:9143:143"
      - "127.0.0.1:9993:993"
      - "127.0.0.1:9080:80"
volumes:
  maildata: